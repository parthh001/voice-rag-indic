name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Deliberately no SARVAM_API_KEY / GROQ_API_KEY in the environment -- this
    # proves the mock-provider path is what CI actually exercises, not an assertion.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        env:
          STT_PROVIDER: mock
          LLM_PROVIDER: mock
        run: pytest -v

      - name: Verify no secrets or dataset files are tracked
        run: |
          if git ls-files | grep -Ei '\.env$|\.wav$|parquet'; then
            echo "Tracked secret/audio/dataset files found -- failing build."
            exit 1
          fi
          echo "No tracked .env, .wav, or parquet files."
